<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiayou Gemini</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; text-align: center; }
    input { padding: 10px; width: 60%; }
    button { padding: 10px 20px; margin-left: 10px; }
    pre { margin-top: 20px; background: #eee; padding: 20px; white-space: pre-wrap; text-align: left; max-width: 800px; margin-inline: auto; }
  </style>
</head>
<body>
  <h1>🚀 Jiayou Gemini</h1>

  <p>
    <input id="endpoint" placeholder="后端地址，例如 https://your-app.deno.dev/api/chat" />
    <button onclick="saveEndpoint()">保存</button>
  </p>

  <input id="input" placeholder="请输入内容..." />
  <button onclick="send()">发送</button>

  <pre id="result">等待回复...</pre>

  <script>
    // The chat backend is not part of this repo: its address is entered once
    // on the page and remembered in this browser only.
    const endpointBox = document.getElementById("endpoint");
    try { endpointBox.value = localStorage.getItem("chatEndpoint") || ""; } catch (e) {}
    function saveEndpoint() {
      try { localStorage.setItem("chatEndpoint", endpointBox.value.trim()); } catch (e) {}
    }

    async function send() {
      const endpoint = endpointBox.value.trim();
      if (!endpoint) {
        alert("请先填写后端地址！");
        return;
      }
      const input = document.getElementById("input").value;
      if (!input) {
        alert("请输入内容！");
        return;
      }
      document.getElementById("result").innerText = "🤖 AI 正在思考中...";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: input }),
        });
        const data = await res.json();
        document.getElementById("result").innerText = data.reply || "❌ 无响应";
      } catch (error) {
        document.getElementById("result").innerText = "❌ 请求失败：" + error;
      }
    }
  </script>
</body>
</html>
